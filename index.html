<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="container mt-12 pt-5">
        <div class="row">
            <div class="col-md-10 m-auto">
                <h4 class="text-center mt-6 mb-6">Convert Dollar To Egyptian Pound</h4>
                <form onsubmit=" return dollarToPounds()">
                    <input type="text" placeholder="Enter Amount Of Dollar" id="dollar" name="Dollar" class="form-control mb-6">
                    <input type="submit" value="Convert" class="btn-solid theme-success w-100  ">
                </form>
                <h5 id="result"></h5>
            </div>
            
        </div>
    </div>
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="js/main.js"></script>
  </body>
</html>
